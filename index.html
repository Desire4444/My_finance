<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mobiledger</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site_header">
        <nav class="nav_bar">
                <a href="#" class="nav_logo">Mobiledger</a>
            <ul class="nav_list">
                <li><a href="#" class="nav_link">Home</a></li>
                <li><a href="#" class="nav_link">Something</a></li>
                <li><a href="#" class="nav_link">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
    <!-- LEFT COLUMN WRAPPER -->
    <div class="left_column">
        <div class="balance_box">
            <h3>Current Balance</h3>
            <p id="balance">Mwk 0.00</p>
            <button id="reset_button">Reset Balance</button>
        </div>
        
        <div class="main_entry_box">
            <form class="entry_box">
                <h3>Deposit Money</h3>
                <label for="deposit_input">Amount-(MWK)</label>
                <input type="number" name="Amount" id="deposit_input" min="1" placeholder="0.00" required>
                <button id="deposit_button">Deposit</button>
            </form>
            
            <form class="entry_box">
                <h3>Withdraw Money</h3>
                <label for="withdraw_input">Amount-(MWK)</label>
                <input type="number" name="Amount" id="withdraw_input" min="1" placeholder="0.00" required>
                <button id="withdraw_button">Withdraw</button>
            </form>
        </div>
    </div>

    <!-- RIGHT COLUMN WRAPPER -->
    <div class="right_column">
        <div class="transaction_list">
            <h3>Transaction History</h3>
            <ul id="transaction_list"></ul>
        </div>
    </div>
    </main>

    <script src="script.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
